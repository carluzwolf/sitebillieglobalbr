var wa="https://wa.me/?text="+encodeURIComponent(n.t+" "+location.href.split("#")[0]+"#/n/"+nid(n));
return '<article class="art"><div class="crumb"><a href="'+bk+'">← Voltar</a></div><span class="kk">'+esc(c[1])+'</span><h1>'+esc(n.t)+'</h1>'+(n.d?'<p class="sub">'+esc(n.d)+'</p>':'')+
'<div class="by">Por <b>'+esc(n.manual?SITE.name+" "+SITE.suffix:n.s)+'</b>'+(n.date?' · '+esc(n.date):'')+(n.body&&n.body.length?' · '+minRead(n)+' min de leitura':'')+'</div>'+artBody(n)+
(n.manual?'<div class="srcbox">Publicado pela equipe do <b>'+esc(SITE.name+" "+SITE.suffix)+'</b>.</div>':'<div class="srcbox">Texto produzido pela equipe do Billie Global BR com base em informações publicadas por <b>'+esc(n.s)+'</b><br><a href="'+esc(n.u)+'" target="_blank" rel="noopener">Fonte: ver matéria original ↗</a></div>')+
'<div class="acts"><a class="btn" href="'+wa+'" target="_blank" rel="noopener">Compartilhar no WhatsApp</a><a class="btn o" href="'+bk+'">← Voltar às notícias</a></div></article>'+
(rel.length?'<div class="rel">'+stitle("Leia também")+rel.map(rowH).join("")+'</div>':'')}
/* rotas */
function paint(h,mode){$("v").innerHTML=h;document.querySelectorAll(".rv").forEach(function(c){io.observe(c)});
if(mode==="keep")return;if(typeof mode==="number"){scrollTo(0,mode);document.querySelectorAll(".rv").forEach(function(c){if(c.getBoundingClientRect().top<innerHeight*1.2){c.classList.add("in");io.unobserve(c)}})}else scrollTo(0,0)}
function more(){lim+=PER;if(cur)paint(cur(),"keep")}
function route(){var h=location.hash||"#/",m,kind="list",key=h,act="home",restore=null;cur=null;closeAll();$("q").value="";
document.title=SITE.name+" "+SITE.suffix+" — Notícias da Billie Eilish";
if(h.match(/^#\/n\//)||h==="#/sobre"||h==="#/canal"||h==="#/grupo")kind="page";
if(kind==="list"&&lastKind==="page"&&POS[h])restore=POS[h];
lim=restore?restore.lim:PER;
var py=restore?restore.y:undefined;
if(m=h.match(/^#\/n\/(\w+)/)){var n=items.filter(function(x){return nid(x)===m[1]})[0];
if(!n){location.hash="#/";return}
document.title=n.t+" — "+SITE.name+" "+SITE.suffix;secNav(cat(n)[0]);paint(artPage(n));lastKind="page";lastKey=h;return}
if(h==="#/sobre"){secNav("");paint('<div class="art"><div class="crumb"><a href="#/">← Voltar ao site principal</a></div><h1>'+esc(SITE.sobre.title)+'</h1>'+blocksH(SITE.sobre.body)+'<div class="acts"><a class="btn" href="#/canal">Canal de WhatsApp</a><a class="btn" href="#/grupo">Grupo de WhatsApp</a><a class="btn o" href="#/">← Início</a></div></div>');lastKind="page";return}
if(h==="#/canal"){secNav("");paint(waPage(SITE.canal,LINK_CANAL));lastKind="page";return}
if(h==="#/grupo"){secNav("");paint(waPage(SITE.grupo,LINK_GRUPO));lastKind="page";return}
if(h==="#/noticias"){act="all";cur=function(){return '<div class="wrap">'+stitle("Todas as notícias",items.length+" matérias")+rowsH(ordered(items),true)+'</div>'}}
else if(m=h.match(/^#\/c\/(\w+)/)){var cc=CATS.filter(function(x){return x[0]===m[1]})[0]||["geral","Geral"];act=cc[0];
cur=function(){return '<div class="wrap">'+stitle(cc[1])+rowsH(byCat(cc[0]),true)+'</div>'}}
else{cur=function(){var o=ordered(items),lead=o[0],side=o.slice(1,4),rest=o.slice(4);
return '<img class="banner" src="'+esc(SITE.banner)+'" alt="'+esc(SITE.bannerAlt)+'"><div class="wrap"><div class="cta"><a class="btn" href="'+esc(LINK_GRUPO)+'" target="_blank" rel="noopener">'+esc(SITE.ctaGrupo)+'</a><a class="btn" href="'+esc(LINK_CANAL)+'" target="_blank" rel="noopener">'+esc(SITE.ctaCanal)+'</a></div>'+
(lead?'<div class="hg">'+leadH(lead)+'<div class="side">'+side.map(rowH).join("")+'</div></div>':'<div class="empty">Em breve, novas notícias.</div>')+
(rest.length?stitle(SITE.homeTitle,upd)+rowsH(rest,true):'')+'</div>'}}
secNav(act);paint(cur(),py);lastKind="list";lastKey=h}
/* navegação: guarda a posição antes de abrir uma notícia */
document.addEventListener("click",function(e){var a=e.target.closest("a[href^='#/n/']");if(a&&lastKind==="list"){POS[lastKey]={y:scrollY,lim:lim};backTo=lastKey}},true);
if("scrollRestoration" in history)history.scrollRestoration="manual";
function closeAll(){$("dr").classList.remove("on");$("ov").classList.remove("on");$("sp").classList.remove("on")}
$("bm").onclick=function(){$("dr").classList.add("on");$("ov").classList.add("on")};
$("bx").onclick=$("ov").onclick=closeAll;
$("bs").onclick=function(){var s=$("sp");if(s.classList.contains("on")){s.classList.remove("on")}else{s.classList.add("on");$("q").focus()}};
$("q").oninput=function(){var q=this.value.trim();if(q.length<2){route2();return}
lim=PER;cur=function(){return '<div class="wrap">'+stitle("Resultados para “"+q+"”")+rowsH(matches(q),true)+'</div>'};secNav("");paint(cur(),"keep")};
function route2(){var k=$("q").value;route();$("q").value=k;$("sp").classList.add("on")}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});
function mkRe(k){var w=String(k||"").split(",").map(function(x){return x.trim()}).filter(Boolean).map(function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")});return w.length?new RegExp(w.join("|"),"i"):/$^/}
function applySite(s){try{
if(s.links){if(s.links.grupo)LINK_GRUPO=s.links.grupo;if(s.links.canal)LINK_CANAL=s.links.canal}
["name","suffix","banner","bannerAlt","ctaGrupo","ctaCanal","homeTitle","footer"].forEach(function(k){if(s[k]!=null&&s[k]!=="")SITE[k]=s[k]});
["sobre","canal","grupo"].forEach(function(k){if(s[k]&&typeof s[k]==="object")SITE[k]=Object.assign({},SITE[k],s[k])});
if(Array.isArray(s.cats)&&s.cats.length){CATS=s.cats.map(function(c){return [c.slug,c.label,mkRe(c.keywords)]});ORDER=s.cats.map(function(c){return c.slug})}
document.querySelector(".logo .ln").textContent=SITE.name;document.querySelector(".logo b").textContent=SITE.suffix;
document.querySelector(".dn").innerHTML=esc(SITE.name)+" <b>"+esc(SITE.suffix)+"</b>";
document.querySelector(".ln2").textContent=SITE.name;document.querySelector(".fb b").textContent=SITE.suffix;
$("ft").textContent=SITE.footer;$("dg").href=LINK_GRUPO;$("dc").href=LINK_CANAL;$("fg").href=LINK_GRUPO;$("fc2").href=LINK_CANAL;
$("dcat").innerHTML=CATS.map(function(c){return '<a href="#/c/'+c[0]+'">'+c[1]+'</a>'}).join("")}catch(e){}}
addEventListener("hashchange",route);
applySite({});
route();
fetch("site.json?"+Date.now()).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(s){applySite(s);try{if(!$("q").value)route()}catch(e){}}).catch(function(){});
fetch("news.json?"+Date.now()).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){
j=(Array.isArray(j)?j:[]).filter(function(x){return x&&x.t&&x.u&&!x.hide});if(j.length){var bk=items;items=j;upd="Atualizado há instantes";try{if(!$("q").value)route()}catch(e){items=bk;route()}}}).catch(function(){});
</script></body></html>
