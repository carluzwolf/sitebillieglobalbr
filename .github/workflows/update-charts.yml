name: Atualizar charts
on:
  schedule:
    - cron: "0 */2 * * *"      # a cada 2 horas
  workflow_dispatch: {}         # permite rodar manualmente (botão "Run workflow")
  push:
    paths:                      # roda na hora quando você envia o script/arquivo novo
      - "scripts/update_charts.py"
      - ".github/workflows/update-charts.yml"
permissions:
  contents: write
concurrency:
  group: update-charts
  cancel-in-progress: false
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler os charts (Spotify, Apple Music, Deezer, Billboard)
        run: python scripts/update_charts.py
      - name: Commit
        run: |
          git config user.name "charts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add charts.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza charts"
            # o workflow de notícias também faz push: atualiza antes de enviar
            for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break || sleep 5; done
          fi
